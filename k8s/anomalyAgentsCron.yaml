# One CronJob per module. Schedule is IST because the window is IST calendar days and the
# report is read by people in India — see instructions/COMMON.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: anomaly-agent-journeys
  namespace: journeys
  labels:
    app: anomaly-agent-journeys
    type: cronjob
spec:
  schedule: "30 9 * * *"
  timeZone: Asia/Kolkata
  # A second copy would file duplicate tickets for the same IncidentKey.
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # One attempt. A retry re-reads the same window and re-posts the same two messages.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: agent
              image: IMAGE_PLACEHOLDER
              command: ["yarn", "run:daily", "--module=journeys"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                # Values are synced from Infisical; this repo holds key names only.
                - secretRef:
                    name: anomaly-agents-secrets
